name: Security
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, release/presenter-mode]
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download pinned Gitleaks and verify checksum
        run: |
          mkdir -p /tmp/gitleaks
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern '*linux_x64.tar.gz' --pattern '*checksums.txt' --dir /tmp/gitleaks
          cd /tmp/gitleaks
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
      - run: /tmp/gitleaks/gitleaks git --redact --exit-code 1
