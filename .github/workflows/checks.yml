name: Checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, release/presenter-mode]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.10.2'
          enable-cache: true
      - run: uv sync --frozen --extra aws
      - name: Lint, format, and documentation
        run: |
          uv run ruff check src examples scripts tests deploy
          uv run ruff format --check src
          uv run python scripts/verify_docs.py
      - name: Application coverage gate
        run: uv run --extra aws pytest --cov=runbookops --cov-branch --cov-report=term-missing --cov-report=json:artifacts/coverage/python.json -q
      - run: uv run runbookops evaluate
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: python-${{ matrix.python }}-reports
          path: |
            artifacts/coverage/python.json
            artifacts/evaluation.json
          if-no-files-found: warn
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: javascript-coverage
          path: artifacts/coverage/javascript
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.8'
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform/presenter init -backend=false -input=false
      - run: terraform -chdir=infra/terraform/presenter validate
      - run: terraform -chdir=infra/terraform/presenter test
      - run: terraform -chdir=infra/terraform/bootstrap init -backend=false -input=false
      - run: terraform -chdir=infra/terraform/bootstrap validate
      - run: terraform -chdir=infra/terraform/logs init -backend=false -input=false
      - run: terraform -chdir=infra/terraform/logs validate
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: docker compose up --build -d --wait
      - run: python3 scripts/container_smoke.py
      - name: Container vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: runbookops:local
          format: json
          output: artifacts/container-vulnerabilities.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Container SBOM
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: runbookops:local
          format: cyclonedx
          output: artifacts/container-sbom.json
          exit-code: '0'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: container-reports
          path: artifacts/container-*.json
      - run: docker compose down
        if: always()
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.10.2'
      - run: uv export --frozen --no-dev --extra aws --no-emit-project --format requirements-txt > /tmp/requirements.txt
      - run: uv run python scripts/audit_dependencies.py
